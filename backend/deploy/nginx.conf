# Install inside nginx http context. Configure TLS on the host/load balancer
# before admitting real users. Do not expose port 8000 to the internet.
limit_req_zone $binary_remote_addr zone=campus_auth:10m rate=10r/m;
server {
    listen 80;
    server_name _;
    client_max_body_size 6m;
    root /opt/campus/docs;
    index index.html;

    location = / { return 302 /campus-lost-found-uniapp/; }
    location /campus-lost-found-uniapp/ {
        alias /opt/campus/docs/;
        add_header X-Content-Type-Options nosniff;
    }
    location ~ ^/api/auth/(code|verify)$ {
        limit_req zone=campus_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 70s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 70s;
    }
    location / { return 404; }
}
